server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ecomm_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
logging:
  level:
    org.springframework.cache: trace